name: Daily Briefing

on:
  schedule:
    # Runs at both possible UTC offsets for 7:25 AM Toronto time.
    # The job checks Toronto local time and skips if outside 7-8 AM window.
    - cron: "25 11 * * *"  # 7:25 AM EDT (summer)
    - cron: "25 12 * * *"  # 7:25 AM EST (winter)
  workflow_dispatch: # Manual trigger for testing

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Toronto time window
        id: timecheck
        run: |
          TORONTO_HOUR=$(TZ='America/Toronto' date +%H)
          echo "Toronto hour: $TORONTO_HOUR"
          if [ "$TORONTO_HOUR" -ge 7 ] && [ "$TORONTO_HOUR" -lt 8 ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "Outside 7-8 AM Toronto window, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Daily Briefing
        if: steps.timecheck.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        env:
          NEWSLETTER_SMTP_PASSWORD: ${{ secrets.NEWSLETTER_SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Upload health report
        if: always() && (steps.timecheck.outputs.skip != 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: health-${{ github.run_id }}
          path: output/health/
          retention-days: 30
