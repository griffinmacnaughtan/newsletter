name: Daily Briefing

on:
  schedule:
    # Two crons cover both DST offsets for ~7:25 AM Toronto.
    # The job checks which cron fired and skips the wrong-season one.
    - cron: "25 11 * * *"  # 7:25 AM EDT (summer, UTC-4)
    - cron: "25 12 * * *"  # 7:25 AM EST (winter, UTC-5)
  workflow_dispatch: # Manual trigger for testing

# Prevent duplicate sends if GitHub fires the same cron twice
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check correct seasonal trigger
        id: timecheck
        run: |
          # Instead of checking wall clock (unreliable due to GH cron delays),
          # check which cron expression fired vs current DST offset.
          OFFSET=$(TZ='America/Toronto' date +%z)
          echo "Toronto UTC offset: $OFFSET"
          if [ "$OFFSET" = "-0400" ]; then
            EXPECTED="25 11 * * *"
            echo "EDT (summer) — expecting 11:25 UTC trigger"
          else
            EXPECTED="25 12 * * *"
            echo "EST (winter) — expecting 12:25 UTC trigger"
          fi
          ACTUAL="${{ github.event.schedule }}"
          echo "Expected cron: $EXPECTED"
          echo "Actual cron:   $ACTUAL"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "Wrong seasonal trigger, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Daily Briefing
        if: steps.timecheck.outputs.skip != 'true' || github.event_name == 'workflow_dispatch'
        env:
          NEWSLETTER_SMTP_PASSWORD: ${{ secrets.NEWSLETTER_SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Upload health report
        if: always() && (steps.timecheck.outputs.skip != 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: health-${{ github.run_id }}
          path: output/health/
          retention-days: 30
